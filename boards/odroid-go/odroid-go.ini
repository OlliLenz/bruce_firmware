; ODROID-GO (original ESP32-WROVER handheld)
;
; The Hardkernel bootloader installs .fw packages from SD card. The raw app
; binary produced by this environment must be wrapped with mkfw before copying
; it to /odroid/firmware on the SD card.

[env:odroid-go]
extends = env
board = odroid-go
board_build.partitions = boards/odroid-go/partitions_16Mb_fw.csv
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 4194304
build_src_filter = ${env.build_src_filter} +<../boards/odroid-go>
custom_app_bin_name = Bruce-odroid-go-firmware.bin
custom_odroid_go_fw_enabled = yes
custom_odroid_go_fw_name = Bruce-odroid-go.fw
custom_odroid_go_fw_description = Bruce
custom_odroid_go_tile_png = media/pictures/bruce_hd.png
custom_odroid_go_mkfw_repo = https://github.com/othercrashoverride/odroid-go-firmware.git
custom_odroid_go_mkfw_ref = factory
custom_odroid_go_mkfw_dir = .pio/odroid-go-firmware/tools/mkfw
extra_scripts =
	${env.extra_scripts}
	post:boards/odroid-go/build_fw.py
build_flags =
	${env.build_flags}
	-Iboards/odroid-go
	-DCORE_DEBUG_LEVEL=5

	; Features with known onboard support
	-DBUZZ_PIN=26
	-DBAT_PIN=36
	-DHAS_SCREEN=1
	-DFORCE_DEFAULT_ROTATION=1

	; Keep optional external radio wiring selectable, but avoid defaulting to
	; pins used by onboard display/SD/button hardware.
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DIR_TX_PINS='{{"P2 GPIO15", 15}, {"P2 GPIO4", 4}}'
	-DIR_RX_PINS='{{"P2 GPIO15", 15}, {"P2 GPIO4", 4}}'
	-DRF_TX_PINS='{{"P2 GPIO15", 15}, {"P2 GPIO4", 4}}'
	-DRF_RX_PINS='{{"P2 GPIO15", 15}, {"P2 GPIO4", 4}}'
	-DTXLED=15
	-DRXLED=4
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; TFT_eSPI setup: ODROID-GO has a 2.4 inch ILI9341 on VSPI.
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_INVERSION_OFF=1
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_BACKLIGHT_ON=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DROTATION=3
	-DTFT_MOSI=23
	-DTFT_MISO=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=21
	-DTFT_RST=-1
	-DTFT_BL=14
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000

	; SD card shares the TFT SPI bus and uses a separate CS.
	-DSDCARD_CS=22
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23

	; Expansion port defaults
	-DGROVE_SDA=15
	-DGROVE_SCL=4
	-DBAD_TX=15
	-DBAD_RX=4
	-DSPI_SCK_PIN=18
	-DSPI_MOSI_PIN=23
	-DSPI_MISO_PIN=19
	-DSPI_SS_PIN=15

	-DDEVICE_NAME='"ODROID-GO"'

lib_ignore =
	USBHID
	RPAsyncTCP
	ESPAsyncTCP
